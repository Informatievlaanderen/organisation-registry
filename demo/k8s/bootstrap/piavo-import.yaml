# ---------------------------------------------------------------
# PIAVO import job: waits for the API, then imports PIAVO data
# ---------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: piavo-import
  namespace: wegwijs-demo
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-api
          image: busybox:1.38
          command: ['sh', '-c', 'until nc -z api 80; do echo waiting for api; sleep 5; done']
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
      containers:
        - name: piavo-import
          image: wegwijs-piavo-import:local
          # resources:
          #   requests: { cpu: 100m, memory: 128Mi }
          #   limits: { memory: 256Mi }
          env:
            # API
            - { name: API_BASE, value: "http://api" }

            # Auth / JWT
            - { name: DEVELOPER_VO_ID, valueFrom: { secretKeyRef: { name: demo-secrets, key: developer-vo-id } } }
            - { name: JWT_SIGNING_KEY, valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-signing-key } } }
            - { name: JWT_ISSUER,      valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-issuer } } }
            - { name: JWT_AUDIENCE,    valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-audience } } }
