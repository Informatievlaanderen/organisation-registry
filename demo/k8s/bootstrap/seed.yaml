# ---------------------------------------------------------------
# Seed job: waits for the API, then loads demo data
# ---------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: wegwijs-demo
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure

      initContainers:
      - name: wait-for-api
        image: busybox:1.38
        command: ['sh', '-c', 'until nc -z api 80; do echo waiting for api; sleep 5; done']
        resources:
          requests: { cpu: 10m, memory: 16Mi }
          limits: { memory: 32Mi }

      containers:
      - name: seed
        image: wegwijs-seed:local
        # resources:
          # requests: { cpu: 100m, memory: 128Mi }
          # limits: { memory: 256Mi }
        env:
          # API
          - { name: API_BASE, value: "http://api" }

          # Auth / JWT
          - { name: CLIENT_ID,         valueFrom: { secretKeyRef: { name: demo-secrets, key: cjm-client-id } } }
          - { name: CLIENT_SECRET,     valueFrom: { secretKeyRef: { name: demo-secrets, key: cjm-client-secret } } }
          - { name: JWT_SIGNING_KEY,   valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-signing-key } } }
          - { name: JWT_ISSUER,        valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-issuer } } }
          - { name: JWT_AUDIENCE,      valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-audience } } }
          - { name: DEVELOPER_VO_ID,   valueFrom: { secretKeyRef: { name: demo-secrets, key: developer-vo-id } } }

          # Certificates
          - { name: KBO_CERTIFICATE,              valueFrom: { secretKeyRef: { name: demo-secrets, key: kbo-certificate } } }
          - { name: RIJKSREGISTER_CERTIFICATE_PWD, valueFrom: { secretKeyRef: { name: demo-secrets, key: rijksregister-certificate-password } } }

          # MSSQL
          - { name: MSSQL_HOST,     value: mssql }
          - { name: MSSQL_USER,     value: sa }
          - { name: MSSQL_PASSWORD, valueFrom: { secretKeyRef: { name: demo-secrets, key: mssql-sa-password } } }
          - { name: MSSQL_DB,       value: OrganisationRegistry }
