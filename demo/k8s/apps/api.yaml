# ---------------------------------------------------------------
# API: Organisation Registry backend
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: wegwijs-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
      - name: api
        image: wegwijs-api:local
        imagePullPolicy: Always
        # resources:
        #   requests: { cpu: 200m, memory: 512Mi }
        #   limits: { memory: 1Gi }
        ports:
          - { name: http, containerPort: 9002 }
        startupProbe:
          httpGet: { path: /v1/status, port: http }
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet: { path: /health, port: http }
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
        env:
          - { name: ASPNETCORE_ENVIRONMENT, value: Development }
          # Database (MSSQL_SA_PASSWORD must stay above the connection strings: $(VAR) only expands earlier vars)
          - { name: MSSQL_SA_PASSWORD, valueFrom: { secretKeyRef: { name: demo-secrets, key: mssql-sa-password } } }
          - { name: Configuration__ConnectionString, value: &mssql "Server=mssql,1433;Database=OrganisationRegistry;User Id=sa;Password=$(MSSQL_SA_PASSWORD);TrustServerCertificate=True;MultipleActiveResultSets=True" }
          - { name: Infrastructure__EventStoreConnectionString, value: *mssql }
          - { name: Infrastructure__EventStoreAdministrationConnectionString, value: *mssql }
          - { name: SqlServer__ConnectionString, value: *mssql }
          - { name: SqlServer__MigrationsConnectionString, value: *mssql }
          # Search
          - { name: ElasticSearch__ReadConnectionString,  value: "http://opensearch:9200/" }
          - { name: ElasticSearch__WriteConnectionString, value: "http://opensearch:9200/" }
          # External services (mocked)
          - { name: Api__KboMagdaEndpoint,         value: "http://wiremock:8080" }
          - { name: Api__RepertoriumMagdaEndpoint, value: "http://wiremock:8080" }
          # KBO type ids
          - { name: Api__KboV2RegisteredOfficeLocationTypeId,            value: "a7e93f04-0004-0000-0000-000000000001" }
          - { name: Api__KboV2LegalFormOrganisationClassificationTypeId, value: "a7e93f06-0006-0000-0000-000000000001" }
          - { name: Api__KboV2FormalNameLabelTypeId,                     value: "a7e93f02-0002-0000-0000-000000000004" }
          # Certificates
          - { name: Api__KboCertificate,          valueFrom: { secretKeyRef: { name: demo-secrets, key: kbo-certificate } } }
          - { name: Api__RijksRegisterCertificatePwd, valueFrom: { secretKeyRef: { name: demo-secrets, key: rijksregister-certificate-password } } }
          # Api JWT
          - { name: Api__JwtSharedSigningKey, valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-signing-key } } }
          - { name: Api__JwtIssuer,           valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-issuer } } }
          - { name: Api__JwtAudience,         valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-audience } } }
          # OIDC (browser-facing URLs use keycloak.localhost, in-cluster URLs use keycloak)
          - { name: OIDCAuth__Authority,                value: "http://keycloak.localhost:9080/realms/wegwijs" }
          - { name: OIDCAuth__InternalAuthorityOverride, value: "http://keycloak/realms/wegwijs" }
          - { name: OIDCAuth__AuthorizationEndpoint,    value: "http://keycloak.localhost:9080/realms/wegwijs/protocol/openid-connect/auth" }
          - { name: OIDCAuth__UserInfoEndPoint,         value: "http://keycloak.localhost:9080/realms/wegwijs/protocol/openid-connect/userinfo" }
          - { name: OIDCAuth__EndSessionEndPoint,       value: "http://keycloak.localhost:9080/realms/wegwijs/protocol/openid-connect/logout" }
          - { name: OIDCAuth__AuthorizationIssuer,      value: "http://keycloak.localhost:9080/realms/wegwijs" }
          - { name: OIDCAuth__AuthorizationRedirectUri, value: "http://ui.localhost:9080/oic" }
          - { name: OIDCAuth__PostLogoutRedirectUri,    value: "http://ui.localhost:9080" }
          - { name: OIDCAuth__ClientId,                 value: "organisation-registry-local-dev" }
          - { name: OIDCAuth__TokenEndPoint,            value: "/protocol/openid-connect/token" }
          - { name: OIDCAuth__JwksUri,                  value: "http://keycloak/realms/wegwijs/protocol/openid-connect/certs" }
          - { name: OIDCAuth__IntrospectionEndpoint,    value: "http://keycloak/realms/wegwijs/protocol/openid-connect/token/introspect" }
          - { name: OIDCAuth__Developers,               value: "9c2f7372-7112-49dc-9771-f127b048b4c7" }
          # OIDC JWT
          - { name: OIDCAuth__JwtSharedSigningKey, valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-signing-key } } }
          - { name: OIDCAuth__JwtIssuer,           valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-issuer } } }
          - { name: OIDCAuth__JwtIssuers,          valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-issuers } } }
          - { name: OIDCAuth__JwtAudience,         valueFrom: { secretKeyRef: { name: demo-secrets, key: jwt-audience } } }
          # Edit API / token exchange
          - { name: EditApi__ClientId,                 value: "organisation-registry-api" }
          - { name: EditApi__ClientSecret,             value: "api-introspection-secret-2024" }
          - { name: EditApi__Authority,                value: "http://keycloak.localhost:9080/realms/wegwijs" }
          - { name: EditApi__IntrospectionEndpoint,    value: "http://keycloak/realms/wegwijs/protocol/openid-connect/token/introspect" }
          - { name: TokenExchange__ClientId,           value: "organisation-registry-api" }
          - { name: TokenExchange__ClientSecret,       value: "api-introspection-secret-2024" }
          - { name: TokenExchange__Authority,          value: "http://keycloak.localhost:9080/realms/wegwijs" }
          - { name: TokenExchange__IntrospectionEndpoint, value: "http://keycloak/realms/wegwijs/protocol/openid-connect/token/introspect" }
          - { name: TokenExchange__Enabled,            value: "true" }
          # Feature flags
          - { name: FeatureManagement__BffApi,  value: "true" }
          - { name: FeatureManagement__EditApi, value: "true" }
          # Telemetry
          - { name: DataDog__Enabled,     value: "false" }
          - { name: DataDog__Debug,       value: "false" }
          - { name: DataDog__ServiceName, value: "organisation-registry-demo" }
          # OpenTelemetry → OTel Collector (gRPC, poort 4317)
          - { name: COLLECTOR_URL, value: "http://otel-collector:4317" }
          # CORS origins: used by the AllowSpecificOrigin policy (production only).
          # In Development, AllowAnyOrigin is used instead (see Startup.cs), so these are informational only.
          - { name: Cors__0, value: "http://ui.localhost:9080" }
          - { name: Cors__1, value: "http://app.localhost:9080" }
          - { name: Cors__2, value: "http://localhost:9080" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: wegwijs-demo
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: http }
