apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: wegwijs-demo
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50
      batch: {}

    exporters:
      otlphttp/seq:
        endpoint: http://seq:5341/ingest/otlp
        tls:
          insecure: true
      # Seq doesn't ingest OTLP metrics; accept and drop them
      # instead of the app getting export errors.
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/seq]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/seq]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: wegwijs-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.159.0
        imagePullPolicy: IfNotPresent
        args: ["--config=/etc/otel/config.yaml"]
        ports:
        - containerPort: 4317  # OTLP gRPC
        - containerPort: 4318  # OTLP HTTP
        - containerPort: 13133 # health check
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /
            port: 13133
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/otel
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: wegwijs-demo
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
