apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: wegwijs-dev
servers: 1
agents: 0
ports:
  - port: 9080:80
    nodeFilters:
      - loadbalancer
registries:
  config: |
    mirrors:
      docker.io:
        endpoint:
          - "http://host.k3d.internal:5000"
      mcr.microsoft.com:
        endpoint:
          - "http://host.k3d.internal:5001"
  create:
    name: k3d-wegwijs-registry
    host: "0.0.0.0"
    hostPort: "5051"
